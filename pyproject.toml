[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "persistence-router"
version = "0.1.0"
description = "Retrospective reconstruction of model-routing instrumentation for The Price of Persistence"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
persistence-router = "persistence_router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
